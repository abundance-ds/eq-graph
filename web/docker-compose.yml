# Neo4j Community Edition for development.
#
# Community Edition has no roles and no users, so the application cannot use a
# read-only account. The query guards in server/utils/cypher.ts do that work.
#
#   docker compose up -d      start
#   docker compose down       stop
#   docker compose down -v    stop and delete the data

services:
  neo4j:
    image: neo4j:5-community
    container_name: eq-graph-neo4j
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/eqgraphdev
      NEO4J_server_memory_heap_max__size: 1G
      # Reject any transaction that runs for too long.
      NEO4J_db_transaction_timeout: 15s
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "eqgraphdev", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j-data:
