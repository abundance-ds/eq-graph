<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    The dune field, built rather than photographed.

    What the reference actually is: crest lines running diagonally across the
    frame, each dune overlapping the next, lit hard from one side so the face
    turned towards the light is pale and the face turned away falls into shadow.
    The near surfaces are covered in fine grain; the far ones are thrown out of
    focus. Those four things are what is constructed here.

    Two things had to be got right. Horizontal bands read as ripples on water,
    so the crests run diagonally and each band is filled along its own slope
    rather than straight down. Straight segments read as folded paper, so every
    crest is a cubic with its handles pulled along the ridge: a dune is a soft
    fold, and the softness is the whole difference.
  -->
  <defs>
    <!-- Grain. Fractal noise lit from the side, so each speck has a bright face
         and a shadow: that is the difference between a granular surface and a
         printed dot screen. Fine enough that it never becomes a pattern. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="2.4" diffuseConstant="1.05" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="55" elevation="52"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="soft"   x="-8%" y="-8%" width="116%" height="116%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="softer" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>

    <!-- Each ramp runs along its dune's own slope, from the lit crest down into
         the shadowed trough. Light grey throughout, but with enough range
         between the two to read as form. -->
    <linearGradient id="far" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#eceeee"/>
      <stop offset="100%" stop-color="#d2d7d8"/>
    </linearGradient>
    <linearGradient id="mid" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#f0f2f2"/>
      <stop offset="42%"  stop-color="#dce1e2"/>
      <stop offset="100%" stop-color="#c4cbcc"/>
    </linearGradient>
    <linearGradient id="near" x1="0.05" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#f6f7f7"/>
      <stop offset="34%"  stop-color="#e2e7e8"/>
      <stop offset="100%" stop-color="#b9c1c3"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.42" y2="1">
      <stop offset="0%"   stop-color="#f3f5f5"/>
      <stop offset="30%"  stop-color="#dbe1e2"/>
      <stop offset="100%" stop-color="#aeb7b9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="#f2f3f3"/>

  <!-- Furthest ridge. Blurred hardest and carrying no grain, because nothing at
       that distance resolves. Its crest is the horizon of the field. -->
  <g filter="url(#softer)">
    <path fill="url(#far)" d="M-40,300 C 150,196 320,110 470,92 C 660,70 830,196 980,214 C 1180,238 1420,110 1640,52 L 1640,560 L -40,560 Z"/>
  </g>

  <!-- Second ridge, still soft, crest falling the other way so the two cross. -->
  <g filter="url(#soft)">
    <path fill="url(#mid)" d="M-40,214 C 220,268 470,346 640,352 C 830,358 1010,236 1180,168 C 1350,102 1500,232 1640,286 L 1640,560 L -40,560 Z"/>
  </g>

  <!-- Third. In focus, so the grain begins, and the crest takes a hairline of
       light — that line is what separates one dune from the one behind it. -->
  <g>
    <path fill="url(#near)" d="M-40,442 C 120,352 270,262 380,244 C 560,214 730,384 900,410 C 1080,438 1220,300 1330,222 C 1450,138 1560,290 1640,330 L 1640,560 L -40,560 Z"/>
    <path fill="#ffffff" opacity="0.42" filter="url(#grain)"
          d="M-40,442 C 120,352 270,262 380,244 C 560,214 730,384 900,410 C 1080,438 1220,300 1330,222 C 1450,138 1560,290 1640,330 L 1640,560 L -40,560 Z"/>
    <path fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5" stroke-linejoin="round"
          d="M-40,442 C 120,352 270,262 380,244 C 560,214 730,384 900,410 C 1080,438 1220,300 1330,222 C 1450,138 1560,290 1640,330"/>
  </g>

  <!-- Nearest dune. Strongest grain, brightest crest, deepest trough. -->
  <g>
    <path fill="url(#front)" d="M-40,560 C 70,466 180,404 250,392 C 470,354 600,520 760,536 C 940,554 1080,438 1180,352 C 1320,232 1500,424 1640,470 L 1640,560 Z"/>
    <path fill="#ffffff" opacity="0.55" filter="url(#grain)"
          d="M-40,560 C 70,466 180,404 250,392 C 470,354 600,520 760,536 C 940,554 1080,438 1180,352 C 1320,232 1500,424 1640,470 L 1640,560 Z"/>
    <path fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="1.8" stroke-linejoin="round"
          d="M-40,560 C 70,466 180,404 250,392 C 470,354 600,520 760,536 C 940,554 1080,438 1180,352 C 1320,232 1500,424 1640,470"/>
  </g>
</svg>
